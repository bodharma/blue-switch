name: Device Manager Regression Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  device-manager:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test Bluetooth reconnection without real peripherals
        run: ./scripts/test-device-manager.sh
